name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Byte-compile
        run: python -m compileall -q amduprof_exporter.py
      - name: Import sanity
        run: python -c "import amduprof_exporter; print('import OK')"
      - name: CLI --help
        run: python amduprof_exporter.py --help
      - name: Parser self-test
        run: python test_parser.py
      - name: parse-file on sample
        run: python amduprof_exporter.py --parse-file samples/sample_memory_output.txt

  dashboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Grafana JSON
        run: |
          find grafana -name '*.json' | while read -r f; do
            echo "validating $f"
            python -m json.tool "$f" > /dev/null
          done
